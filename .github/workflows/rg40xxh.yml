name: RG40XXH PortMaster Package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rg40xxh:
    name: RG40XXH / aarch64 PortMaster package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu imagemagick

      - name: Configure ARM64 build
        run: |
          cmake -S . -B build-rg40xxh \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++

      - name: Build ARM64 executable
        run: cmake --build build-rg40xxh --config Release --parallel

      - name: Verify ARM64 executable
        run: |
          file build-rg40xxh/SpriteStep
          aarch64-linux-gnu-readelf -h build-rg40xxh/SpriteStep | grep -E 'Class|Machine'

      - name: Assemble PortMaster package
        run: |
          mkdir -p package/SpriteStep/SpriteStep
          cp build-rg40xxh/SpriteStep package/SpriteStep/SpriteStep/SpriteStep
          cp SpriteStep.sh package/SpriteStep/SpriteStep.sh
          chmod +x package/SpriteStep/SpriteStep.sh
          chmod +x package/SpriteStep/SpriteStep/SpriteStep

          cat > package/SpriteStep/port.json <<'EOF'
          {
            "version": 2,
            "name": "SpriteStep.zip",
            "items": [
              "SpriteStep.sh",
              "SpriteStep/"
            ],
            "items_opt": null,
            "attr": {
              "title": "SpriteStep",
              "desc": "SpriteStep tracker development build.",
              "inst": "Development test build for Anbernic RG40XXH.",
              "genres": ["music"],
              "porter": ["musicbit68"],
              "image": {},
              "rtr": true,
              "runtime": null,
              "reqs": [],
              "arch": ["aarch64"]
            }
          }
          EOF

          cat > package/SpriteStep/README.md <<'EOF'
          # SpriteStep

          Development PortMaster package for testing SpriteStep on the Anbernic RG40XXH.

          This package is built specifically for aarch64 and is intended for hardware testing, not public PortMaster distribution.
          EOF

          convert -size 640x480 xc:black package/SpriteStep/screenshot.png

          cd package/SpriteStep
          zip -r ../SpriteStep.zip port.json README.md screenshot.png SpriteStep.sh SpriteStep/

      - name: Validate PortMaster package
        run: |
          test -f package/SpriteStep.zip
          unzip -l package/SpriteStep.zip
          unzip -t package/SpriteStep.zip
          rm -rf package/verify
          mkdir -p package/verify
          unzip -q package/SpriteStep.zip -d package/verify
          test -f package/verify/port.json
          test -f package/verify/SpriteStep.sh
          test -f package/verify/SpriteStep/SpriteStep
          test ! -f package/verify/SpriteStep.zip
          bash -n package/verify/SpriteStep.sh
          test -x package/verify/SpriteStep/SpriteStep
          file package/verify/SpriteStep/SpriteStep | grep -E 'ELF 64-bit.*ARM aarch64'
          grep -F 'GAMEDIR="/$directory/ports/SpriteStep"' package/verify/SpriteStep.sh
          grep -F './SpriteStep' package/verify/SpriteStep.sh

      - name: Upload RG40XXH package
        uses: actions/upload-artifact@v4
        with:
          name: SpriteStep-RG40XXH-PortMaster
          path: package/SpriteStep.zip
          if-no-files-found: error
          retention-days: 14
